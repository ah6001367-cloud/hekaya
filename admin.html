<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية - إضافة كارت محل</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1a33;color:#fbefd0;margin:0;padding:18px;max-width:520px;margin-inline:auto}h1{color:#f7bf3a;font-size:20px}label{display:block;margin:10px 0 4px;font-size:13px;color:#9fb4d0}input,select,textarea{width:100%;box-sizing:border-box;background:#0e2142;border:1px solid #2a4a80;border-radius:12px;color:#fbefd0;padding:10px;font:inherit}button{margin-top:14px;width:100%;background:#e2b44c;color:#2b0f0c;border:0;border-radius:12px;padding:12px;font-weight:800;font:inherit}pre{background:#050d1c;border:1px solid #2fb6a055;border-radius:12px;padding:12px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px}small{color:#9fb4d0}</style></head><body>
<h1>إضافة كارت محل لحكاية</h1><small>املا البيانات واضغط "جهّز"، وابعت الناتج لنا. إحنا بنضيفه في biz.json وننشره.</small>
<label>اسم المحل</label><input id="n"><label>عنوان الكارت</label><input id="c" placeholder="كارت ...">
<label>النوع</label><select id="t"><option value="cafe">كافيه</option><option value="food">مطعم / حلويات</option><option value="shop">محل</option><option value="museum">متحف / معرض</option><option value="other">أخرى</option></select>
<label>خط العرض و الطول (من خرائط جوجل: اضغط مطولا على المكان وانسخ الرقمين)</label><input id="ll" placeholder="31.2655, 32.3036" dir="ltr">
<label>نطاق الجمع بالمتر</label><input id="r" value="60" type="number"><label>حكاية قصيرة عن المكان</label><textarea id="s" rows="2"></textarea>
<label>العرض (اللي العميل ياخده)</label><input id="o"><label>كود الكوبون</label><input id="k" dir="ltr"><label>ساري لحد (اختياري)</label><input id="u" type="date"><label>شروط (اختياري)</label><input id="m">
<button onclick="g()">جهّز</button><pre id="out"></pre>
<script>function g(){var p=(ll.value||'').split(/[ ,،]+/).map(Number);var o={id:(n.value||'biz').trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/g,'-')+'-'+Date.now().toString(36).slice(-4),name:n.value.trim(),cat:t.value,lat:p[0],lon:p[1],radius:+r.value||60,card:c.value.trim()||n.value.trim(),story:s.value.trim(),offer:o_.value.trim(),code:k.value.trim()};if(u.value)o.until=u.value;if(m.value)o.terms=m.value.trim();out.textContent=JSON.stringify(o,null,1)+','}var o_=document.getElementById('o')</script></body></html>
