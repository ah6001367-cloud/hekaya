<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية - إدارة كروت المحلات</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1a33;color:#fbefd0;margin:0;padding:18px;max-width:560px;margin-inline:auto}h1{color:#f7bf3a;font-size:20px;margin:0 0 4px}h2{color:#7fe0d4;font-size:16px;margin:22px 0 8px}label{display:block;margin:10px 0 4px;font-size:13px;color:#9fb4d0}input,select,textarea{width:100%;box-sizing:border-box;background:#0e2142;border:1px solid #2a4a80;border-radius:12px;color:#fbefd0;padding:10px;font:inherit}button{margin-top:10px;background:#e2b44c;color:#2b0f0c;border:0;border-radius:12px;padding:11px 14px;font-weight:800;font:inherit;cursor:pointer}button.s{background:#16345f;color:#7fe0d4;border:1px solid #2fb6a066}pre{background:#050d1c;border:1px solid #2fb6a055;border-radius:12px;padding:12px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px}small{color:#9fb4d0}.box{background:#0e2142;border:1px solid #2a4a80;border-radius:16px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.n{font-size:22px;font-weight:900;color:#f7bf3a}.pin{font-family:monospace;font-size:18px;letter-spacing:3px;color:#7fe0d4;direction:ltr}#st{padding:10px;border-radius:12px;background:#0e2142;border:1px solid #2a4a80;margin:10px 0}.ok{color:#7fe0d4}.bad{color:#ff8a7a}</style></head><body>
<h1>إدارة كروت المحلات</h1><small>إحصائيات كل محل، الرقم السري للكاشير، وإضافة محل جديد.</small>
<div id="st">جاري التحميل…</div><div id="cl"></div>
<div id="app" style="display:none">
<h2>المحلات</h2><div id="shops"></div>
<h2>إضافة محل جديد</h2>
<label>اسم المحل</label><input id="n"><label>عنوان الكارت</label><input id="c" placeholder="كارت ...">
<label>النوع</label><select id="t"><option value="cafe">كافيه</option><option value="food">مطعم / حلويات</option><option value="shop">محل</option><option value="museum">متحف / معرض</option><option value="other">أخرى</option></select>
<label>خط العرض و الطول (من خرائط جوجل: اضغط مطولا على المكان وانسخ الرقمين)</label><input id="ll" placeholder="31.2655, 32.3036" dir="ltr">
<label>نطاق الجمع بالمتر</label><input id="r" value="60" type="number"><label>حكاية قصيرة عن المكان</label><textarea id="s" rows="2"></textarea>
<label>عرض أول زيارة (اختياري، مرة واحدة للشخص)</label><input id="o"><label>كود الكوبون</label><input id="k" dir="ltr"><label>ساري لحد (اختياري)</label><input id="u" type="date"><label>شروط (اختياري)</label><input id="m">
<label>كارت الولاء: عدد الطوابع (سيبه فاضي لو مفيش كارت ولاء)</label><input id="ln" type="number" placeholder="10"><label>مكافأة الولاء</label><input id="lr" placeholder="مشروب هدية"><label>أقل فاصل بين طابعين (ساعات)</label><input id="lg" type="number" value="20">
<button id="go">جهّز المحل</button><div id="res"></div>
</div>
<script type="module">
const CFG={apiKey:"AIzaSyCCHIO-bY1zgpt39XSXOXSOkpEzTXiv2OI",authDomain:"hekaya-122d3.firebaseapp.com",projectId:"hekaya-122d3",storageBucket:"hekaya-122d3.firebasestorage.app",messagingSenderId:"835981529763"};
const B='https://www.gstatic.com/firebasejs/10.12.2/';
const EMU=location.hostname==='localhost'&&new URLSearchParams(location.search).get('emu')==='1';
const [a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
const app=a.initializeApp(CFG),auth=au.getAuth(app),db=fs.getFirestore(app);
if(EMU){au.connectAuthEmulator(auth,'http://localhost:9199',{disableWarnings:true});fs.connectFirestoreEmulator(db,'localhost',8185)}
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let list=[];try{list=(await (await fetch('biz.json',{cache:'no-cache'})).json()).list||[]}catch(e){}
const rpin=()=>String(Math.floor(100000+Math.random()*900000));
async function isAdm(u){try{const d=await fs.getDoc(fs.doc(db,'admins','root'));return d.exists()&&d.data().uid===u.uid}catch(e){return false}}
async function claimable(){try{const d=await fs.getDoc(fs.doc(db,'admins','root'));return !d.exists()}catch(e){return true}}
au.onAuthStateChanged(auth,async u=>{
 $('cl').innerHTML='';$('app').style.display='none';
 if(!u){$('st').innerHTML='<span class="bad">لازم تسجل دخول في التطبيق الأول بنفس المتصفح.</span> <a href="index.html" style="color:#7fe0d4">افتح التطبيق</a> وبعدين ارجع هنا.';return}
 if(await isAdm(u)){$('st').innerHTML='<span class="ok">أنت أدمن ✔</span> <small>'+esc(u.email||u.uid)+'</small>';$('app').style.display='block';load();return}
 if(await claimable()){$('st').innerHTML='لسه مفيش أدمن للتطبيق. <small>('+esc(u.email||u.uid)+')</small>';$('cl').innerHTML='<button id="claim">خليني أنا الأدمن</button><br><small>اضغط مرة واحدة بحسابك إنت. بعدها محدش تاني يقدر ياخد المكان.</small>';$('claim').onclick=async()=>{try{await fs.setDoc(fs.doc(db,'admins','root'),{uid:u.uid});location.reload()}catch(e){alert('مقدرناش: '+(e.code||e.message))}};return}
 $('st').innerHTML='<span class="bad">الحساب ده مش الأدمن.</span> سجل دخول بحساب الأدمن في التطبيق.'});
async function load(){
 const real=list.filter(b=>!b.demo);let h='';
 if(!real.length)h='<div class="box"><small>مفيش محلات حقيقية لسه. أضف محل من تحت.</small></div>';
 for(const b of real){let st={},sec={};try{const d=await fs.getDoc(fs.doc(db,'bizStats',b.id));if(d.exists())st=d.data()}catch(e){}try{const d=await fs.getDoc(fs.doc(db,'bizSecrets',b.id));if(d.exists())sec=d.data()}catch(e){}
  h+=`<div class="box"><b>${esc(b.name)}</b> <small>${esc(b.id)}</small><div class="row" style="margin-top:8px"><div><div class="n">${st.col||0}</div><small>اتجمع</small></div><div><div class="n">${st.red||0}</div><small>اتستخدم</small></div><div><div class="n">${st.stp||0}</div><small>طوابع</small></div><div><div class="n">${st.rwd||0}</div><small>مكافآت</small></div><div style="flex:1"></div><div>${sec.pin?'<div class="pin">'+esc(sec.pin)+'</div><small>الرقم السري · '+(sec.n||10)+' طابع · فاصل '+(sec.gap==null?20:sec.gap)+' ساعة</small>':'<small class="bad">مفيش رقم سري: الكارت مش شغال</small>'}</div></div><div class="row"><button class="s" data-id="${esc(b.id)}" data-n="${b.loy?+b.loy.n||10:10}" data-g="${b.loy&&b.loy.gap!=null?+b.loy.gap:20}">رقم سري جديد</button></div></div>`}
 $('shops').innerHTML=h;
 $('shops').querySelectorAll('button').forEach(x=>x.onclick=async()=>{const p=rpin();await fs.setDoc(fs.doc(db,'bizSecrets',x.dataset.id),{pin:p,n:+x.dataset.n,gap:+x.dataset.g});load()})}
$('go').onclick=async()=>{const p=($('ll').value||'').split(/[ ,،]+/).map(Number);if(!$('n').value.trim()||!(p[0]&&p[1])){alert('اكتب اسم المحل والإحداثيات');return}
 const o={id:($('n').value||'biz').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36).slice(-4),name:$('n').value.trim(),cat:$('t').value,lat:p[0],lon:p[1],radius:+$('r').value||60,card:$('c').value.trim()||$('n').value.trim(),story:$('s').value.trim(),code:$('k').value.trim()};if($('o').value.trim())o.offer=$('o').value.trim();
 if($('u').value)o.until=$('u').value;if($('m').value)o.terms=$('m').value.trim();const ln=+$('ln').value||0,lg=$('lg').value===''?20:+$('lg').value;if(ln>0)o.loy={n:ln,reward:$('lr').value.trim(),gap:lg};
 const pin=rpin();try{await fs.setDoc(fs.doc(db,'bizSecrets',o.id),{pin,n:ln||10,gap:lg})}catch(e){alert('مقدرناش نحفظ الرقم السري: '+(e.code||e.message));return}
 $('res').innerHTML='<div class="box"><b class="ok">اتحفظ الرقم السري ✔</b><br><small>الرقم السري للكاشير (اديه للمحل):</small><div class="pin" style="font-size:28px">'+pin+'</div><small>ابعت الكود ده لينا واحنا ننشره:</small><pre>'+esc(JSON.stringify(o,null,1))+',</pre></div>';load()};
</script></body></html>
