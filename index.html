<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حكاية</title><link rel="stylesheet" href="leaflet.css"><style>

.cc b{display:block;font-size:22px}.cc.lk{opacity:.4;filter:grayscale(1)}
</style></head><body>
<div id="top"><span id="ttl"></span><small id="count"></small><button id="cbtn" onclick="openCol()" style="width:auto;flex:none;margin:0 0 0 6px;white-space:nowrap;border:1px solid #e2b44c;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;background:transparent;color:#e2b44c;min-height:0">🃏 <span id="cn"></span></button><button id="tbtn" onclick="togTest()" style="width:auto;flex:none;margin:0;white-space:nowrap;border:1px solid #e2b44c;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;background:transparent;color:#e2b44c">وضع التجربة</button><button id="lbtn" onclick="setLang(EN?'ar':'en')" style="width:auto;flex:none;margin:0 0 0 6px;border:1px solid #e2b44c;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;background:transparent;color:#e2b44c;min-height:0"></button></div>

<script>
{const l=new URLSearchParams(location.search).get('lang');if(l==='en'||l==='ar')localStorage.setItem('hk_lang',l)}const LG=localStorage.getItem('hk_lang')||'ar';const EN=LG==='en';

'soon':['اللغز قريبا','Riddle coming soon'],
'solve':['🧩 حل اللغز واستلم الكارت','🧩 Solve the riddle & get the card'],'seecard':['🃏 شوف كارتك','🃏 See your card'],
'gotcard':['🎉 صح! استلمت كارت جديد','🎉 Correct! New card unlocked'],
'wa':['شارك على واتساب','Share on WhatsApp'],'ok':['تمام','OK'],
'share':['حكاية بورسعيد: فتحت كارت','Hekaya Port Said: I unlocked the card'],
'riddle':['اللغز · ','Riddle · '],'yours':['اكتب إجابتك','Type your answer'],'confirm':['تأكيد','Submit'],
'hint':['تلميح','Hint'],'nohint':['مفيش تلميحات تانية','No more hints'],
'wrong':['لأ، مش كده. فكّر تاني أو خد تلميح.','Not quite. Think again or take a hint.'],
'cards':['كروت الحكاية · ','Hekaya cards · '],'locked2':['مقفول','Locked'],'no':['رقم ','No. '],
'note':['الحكاية بالعربي حاليا، الترجمة الإنجليزية جاية قريبا.','Stories and riddles are in Arabic for now. English translation is coming soon.'],
'notifT':['هنا في حكاية','Here in Hekaya'],'notifB':['حكاية جديدة اتفتحت: ','New story unlocked: '],
'rar':{'عادي':'Common','شائع':'Common','نادر':'Rare','أسطوري':'Legendary'},
'typ':{'شفرة':'Cipher','استنتاج':'Deduction','تفكير جانبي':'Lateral thinking'}
};
const T=k=>{const v=TR[k];return Array.isArray(v)?v[EN?1:0]:v};
const TRR=x=>EN?(TR.rar[x]||x):x, TYP=x=>EN?(TR.typ[x]||x):x;
function setLang(l){localStorage.setItem('hk_lang',l);location.reload()}
document.documentElement.lang=EN?'en':'ar';document.documentElement.dir=EN?'ltr':'rtl';
const R=150;
const qq=new URLSearchParams(location.search);if(qq.get('test')==='1')localStorage.setItem('hk_test','1');if(qq.get('test')==='0')localStorage.removeItem('hk_test');
let TEST=localStorage.getItem('hk_test')==='1';
const isU=n=>TEST||unlocked.includes(n);
function togTest(){TEST=!TEST;TEST?localStorage.setItem('hk_test','1'):localStorage.removeItem('hk_test');S.forEach(x=>markers[x.n]&&markers[x.n].setIcon(icon(x)));count();if(sel)show(sel)}
let S=[],unlocked=JSON.parse(localStorage.getItem('hk_u')||'[]'),me=null,sel=null,demo=false;
const q=new URLSearchParams(location.search);
const map=L.map('map',{zoomControl:false}).setView([31.2650,32.3050],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const ar=n=>EN?String(n):String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.hypot(x,y)*6371000};
let markers={},meMk=null;
function icon(s){return L.divIcon({className:'',html:`<div class="pin ${isU(s.n)?'u':''} ${s.ok?'':'a'}">${ar(s.n)}</div>`,iconSize:[30,30]})}
function setMe(lat,lon){me={lat,lon};if(!meMk)meMk=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false,zIndexOffset:900}).addTo(map);else meMk.setLatLng([lat,lon]);
 S.forEach(s=>{if(dist(lat,lon,s.lat,s.lon)<=R&&!unlocked.includes(s.n)){unlocked.push(s.n);localStorage.setItem('hk_u',JSON.stringify(unlocked));markers[s.n].setIcon(icon(s))}});
 count();if(sel)show(sel)}
function count(){document.getElementById('count').textContent=TEST?T('testall'):`${ar(unlocked.length)} ${T('of')} ${ar(S.length)} ${T('unl')}`;const b=document.getElementById('tbtn');if(b){b.textContent=TEST?T('testmodeon'):T('testmode');document.getElementById('ttl').textContent=T('title');document.getElementById('lbtn').textContent=EN?'العربية':'EN';b.style.background=TEST?'#e2b44c':'transparent';b.style.color=TEST?'#0b1a33':'#e2b44c'}}
function show(s){sel=s;const sh=document.getElementById('sheet');const u=isU(s.n);
 let st='';if(TEST&&!unlocked.includes(s.n))st='<span class="open">'+T('testopen')+'</span>';else if(me){const d=dist(me.lat,me.lon,s.lat,s.lon);st=u?`<span class="open">${T('opened')} ${ar(Math.round(d))} ${T('m')} ${T('away')}</span>`:`<span class="lock">${T('locked')} ${d>=1000?ar((d/1000).toFixed(1))+' '+T('km'):ar(Math.round(d))+' '+T('m')} · ${T('mustbe')} ${ar(R)} ${T('m')}</span>`}else st='<span class="lock">'+T('enable')+'</span>';
 const ph=PH[s.n];const phh=ph?`<div class="ph"><img src="photos/${String(s.n).padStart(2,'0')}.jpg" alt="" loading="lazy"><small>${ph.own?`<span dir="rtl" style="display:block;text-align:right">${ph.own}</span>`:`${ph.x?`<b dir="rtl">${ph.c&&!EN?ph.c:T('approx')}<br></b>`:''}Photo: ${ph.a} · ${ph.l} · <a href="${ph.u}" target="_blank" rel="noopener">${ph.u.includes("wikimedia")?"Wikimedia Commons":ph.u.includes("flickr")?"Flickr":ph.u.includes("wellcome")?"Wellcome Collection":T("source")}</a>`}</small></div>`:'';sh.innerHTML=`${phh}${EN?'<div class="pl">'+T('note')+'</div>':''}<h2 dir="rtl" style="text-align:${EN?'left':'right'}">${ar(s.n)}. ${s.t}</h2><div class="pl" dir="rtl" style="text-align:${EN?'left':'right'}">${s.p}</div>${s.ok?'':'<div class="pl">'+T('pinapprox')+'</div>'}${u?'':`<div class="tz" dir="rtl">${s.tz}</div>`}<div class="st">${st}</div><div class="lk"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.p.split(' · ')[0]+' بورسعيد')}">${T('gmaps')}</a><a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(s.p.split(' · ')[0]+' بورسعيد')}">${T('recent')}</a></div><div class="row"><button ${u?'':'disabled'} onclick="read(${s.n})">${u?T('read'):T('lockedb')}</button><button class="o" onclick="document.getElementById('sheet').classList.remove('on');sel=null">${T('close')}</button></div>`;sh.classList.add('on')}
const HERO0=n=>`<svg viewBox="0 0 390 250" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143a6b"/><stop offset="1" stop-color="#0b1a33"/></linearGradient></defs><rect width="390" height="250" fill="url(#g)"/><circle cx="300" cy="60" r="34" fill="#f4e9c8" opacity=".9"/>`+(n==1?`<polygon points="170,250 185,70 205,70 220,250" fill="#d9c9a0"/><polygon points="183,70 195,35 207,70" fill="#e2b44c"/><rect x="186" y="60" width="18" height="10" fill="#fff7c0"/><polygon points="195,62 380,200 380,120" fill="#fff7c0" opacity=".18"/>`:`<g fill="#07142a"><rect x="20" y="170" width="40" height="80"/><rect x="70" y="150" width="50" height="100"/><rect x="130" y="180" width="36" height="70"/><rect x="176" y="160" width="46" height="90"/><rect x="232" y="185" width="40" height="65"/><rect x="282" y="165" width="50" height="85"/></g>`)+`<rect y="225" width="390" height="25" fill="#07142a"/></svg>`;


let SOL=JSON.parse(localStorage.getItem('hk_s')||'[]');
const RAR={"عادي":1,"شائع":1,"نادر":2,"أسطوري":4};
function nmz(s){s=s.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase().replace(/[^\u0621-\u064A0-9a-z]/g,'');if(s.startsWith('ال')&&s.length>3)s=s.slice(2);return s}
function hsh(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h>>>0}

let HN=0;
function openR(n){if(SOL.includes(n)){showCard(n,false);return}const r=RD[n],e=document.getElementById('rq');HN=0;
e.innerHTML=`<span class="rt">${TYP(r.type)}</span>${EN?'<div class="pl" style="color:#9fb4d0;font-size:13px;margin-top:6px">'+T('note')+'</div>':''}<h2>${T('riddle')}<span dir="rtl">${CARDS[n].name}</span></h2><div class="rtxt" dir="rtl">${r.q}</div><div id="hl"></div><input id="ai" autocomplete="off" placeholder="${T('yours')}" dir="rtl" onkeydown="if(event.key=='Enter')chk(${n})"><div class="msg" id="mg"></div><div class="row"><button onclick="chk(${n})">${T('confirm')}</button><button class="o" onclick="hint(${n})" id="hb">${T('hint')} (${ar(3)})</button></div><div class="row"><button class="o" onclick="closeP('rq')">${EN?'Back':'رجوع'}</button></div>`;e.classList.add('on')}

if(RD[n].ans.includes(hsh(v))){SOL.push(n);localStorage.setItem('hk_s',JSON.stringify(SOL));closeP('rq');cnt();showCard(n,true);if(document.getElementById('reader').classList.contains('on'))read(n)}else{m.className='msg bad';m.textContent=T('wrong')}}
function cnt(){document.getElementById('cn').textContent=ar(SOL.length)+'/'+ar(32)}
function openCol(){const e=document.getElementById('col');e.innerHTML=`<h2>🃏 ${T('cards')}${ar(SOL.length)} ${T('of')} ${ar(32)}</h2><div id="cg">${Object.keys(CARDS).map(k=>{k=+k;const c=CARDS[k],s=SOL.includes(k);return `<div class="cc ${s?'':'lk'}" ${s?`onclick="showCard(${k},false)"`:''}><b>${s?c.e:'❓'}</b>${s?c.name:T('locked2')}<br><small>${ar(String(k).padStart(3,'0'))}</small></div>`}).join('')}</div><div class="row"><button onclick="closeP('col')">${EN?'Back':'رجوع'}</button></div>`;e.classList.add('on')}
cnt();
let CUR=null;
function AUD(n){if(!(n>=1&&n<=32))return '<div class="pl2 off"><div class="pb">▶</div><div style="flex:1"><div class="t">'+T('listen')+' · '+(EN?'soon':'قريبا')+'</div><div class="bar2"></div></div></div>';
return `<div class="pl2" id="pl"><div class="pb" id="pb" onclick="togA(${n})">▶</div><div style="flex:1"><div class="t" id="pt">${T('listen')}</div><div class="bar2" id="pbar" onclick="seekA(event)"><i id="pfill"></i></div></div></div>`}
function fmt(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function togA(n){if(CUR&&CUR.n!=n){CUR.a.pause();CUR=null}
if(!CUR){const a=new Audio('audio/story'+String(n).padStart(2,'0')+'.mp3');a.preload='metadata';CUR={a,n};
a.ontimeupdate=()=>{const f=document.getElementById('pfill'),t=document.getElementById('pt');if(f&&a.duration){f.style.width=(100*a.currentTime/a.duration)+'%';t.textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}};
a.onended=()=>{document.getElementById('pb').textContent='▶'};
a.onerror=()=>{const t=document.getElementById('pt');if(t)t.textContent=T('audfail')}}
const a=CUR.a,b=document.getElementById('pb');if(a.paused){a.play();b.textContent='❚❚'}else{a.pause();b.textContent='▶'}}
function seekA(e){if(!CUR||!CUR.a.duration)return;const r=e.currentTarget.getBoundingClientRect();const x=document.dir=='rtl'||getComputedStyle(e.currentTarget).direction=='rtl'?(r.right-e.clientX):(e.clientX-r.left);CUR.a.currentTime=CUR.a.duration*Math.max(0,Math.min(1,x/r.width))}
function stopA(){if(CUR){CUR.a.pause();CUR=null}}
const HERO=n=>`<img alt="" src="hero/${String(n).padStart(2,'0')}.svg" onerror="this.outerHTML=HERO0(${n})">`;
function read(n){stopA();const s=S.find(x=>x.n==n),r=document.getElementById('reader');
 const body=s.secs.map(x=>{const fact=x.h.includes('[حقيقة]'),h=x.h.replace(/\[(حقيقة|خيال)\]/,'').trim();
  const ps=x.b.map(p=>`<p>${p}</p>`).join('');
  return fact?`<div class="fact"><div class="fh">${T('facthdr')}${h}</div>${ps}</div>`:`<h3>${h}</h3>${ps}`}).join('');
 r.innerHTML=`<div class="hero">${HERO(n)}<a class="back" href="#" onclick="stopA();document.getElementById('reader').classList.remove('on');return false">${T('back')}</a></div><div class="panel">${EN?'<div class="hint">'+T('note')+'</div>':''}<h1 dir="rtl" style="text-align:${EN?'left':'right'}">${s.t}</h1>${AUD(n)}<div><span class="chip">${T('fictional')}</span><span class="chip">${s.p.split('·')[0].trim()}</span></div><div class="tx" dir="rtl">${body}</div><div class="fact"><div class="fh">${T('sources')}</div>${s.src.map(x=>`<div class="src">${x}</div>`).join('')}</div>${solvedBtn(n)}</div>`;r.classList.add('on');r.scrollTop=0}
Promise.all(['stories1.json','stories2.json'].map(u=>fetch(u).then(r=>r.json()))).then(a=>a.flat()).then(d=>{S=d;S.forEach(s=>{markers[s.n]=L.marker([s.lat,s.lon],{icon:icon(s)}).addTo(map).on('click',()=>show(s))});count();
 if(q.get('demo')){const [a,b]=q.get('demo').split(',').map(Number);setMe(a,b)}
 else if(navigator.geolocation)navigator.geolocation.watchPosition(p=>setMe(p.coords.latitude,p.coords.longitude),e=>{},{enableHighAccuracy:true});
 if(q.get('open'))show(S.find(x=>x.n==q.get('open')));
 if(q.get('read'))read(q.get('read'))});
</script></body></html>
