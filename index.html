const dnum=t=>{const d=new Date(t);return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
function points(){const seen=new Set(),ev=EV.filter(e=>!seen.has(e.n)&&seen.add(e.n)),by={};ev.forEach(e=>{const d=dnum(e.t);by[d]=(by[d]||0)+1});
 let multi=0,streak=0,run=0,prev=-9,best=0;Object.values(by).forEach(k=>{for(let i=2;i<=k;i++)multi+=i==2?50:i==3?75:100});
 const days=Object.keys(by).map(Number).sort((a,b)=>a-b);days.forEach(d=>{run=d==prev+1?run+1:1;prev=d;best=Math.max(best,run);if(run>=2)streak+=10*Math.min(run,10)});
 const cur=days.length&&days[days.length-1]>=dnum(Date.now())-1?run:0;
 const PB=JSON.parse(localStorage.getItem('hk_pb')||'{}');let ph=0;Object.values(PB).forEach(c=>{ph+=(c>=1?PT.photo[0]:0)+(c>=2?PT.photo[1]:0)});

function solarMin(t){const d=new Date(t),N=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5),g=2*Math.PI/365*(N-1),eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)),dc=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g),ph=31.26*Math.PI/180,ha=Math.acos(Math.cos(90.833*Math.PI/180)/(Math.cos(ph)*Math.cos(dc))-Math.tan(ph)*Math.tan(dc))*180/Math.PI,lon=32.3;return{rise:720-4*(lon+ha)-eq,set:720-4*(lon-ha)-eq}}
function isNight(t){const d=new Date(t),m=d.getUTCHours()*60+d.getUTCMinutes(),s=solarMin(t);return m>s.set||m<s.rise}

.pc.ch.r1{--c:#dfe6f2}.pc.ch.r2{--c:#7ff0dc}.pc.ch.r3{--c:#ffd36e}.pc.ch.r4{--c:#ffb7e6}

</style>
<script>
const CH=new Set(Array.from({length:32},(_,i)=>i+1));
function tiltInit(root){const set=(p,x,y)=>{p.style.setProperty('--ry',(x*16).toFixed(1)+'deg');p.style.setProperty('--rx',(-y*16).toFixed(1)+'deg');p.style.setProperty('--px',(-x*7).toFixed(1)+'cqw');p.style.setProperty('--py',(-y*4).toFixed(1)+'cqw');p.style.setProperty('--px2',(x*3).toFixed(1)+'cqw')};
 root.addEventListener('pointermove',e=>{const p=e.target.closest&&e.target.closest('.pc');if(!p)return;const r=p.getBoundingClientRect();set(p,(e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>root.addEventListener(ev,e=>{const p=e.target.closest&&e.target.closest('.pc');if(p)set(p,0,0)},true))}
const _cardHTML0=cardHTML;
function cardHTML(n,lk){if(!CH.has(n))return _cardHTML0(n,lk);const c=CARDS[n],k=RAR[c.rar]||1,s=S.find(x=>x.n==n)||{},pl=String(s.p||'').split(' · ')[0],p2=String(n).padStart(2,'0');
 const hint=lk?(isU(n)?(EN?'Solve the riddle to unlock':'حُلّ اللغز علشان تفتحه'):(EN?'Visit '+pl+' to unlock':'روح '+pl+' علشان تفتح')):'';
 const sp=k>=2?[[14,20,0],[76,12,.7],[88,52,1.4],[24,62,.4],[60,34,1.1],[40,8,1.7]].map(a=>`<i class="sp" style="left:${a[0]}%;top:${a[1]}%;animation-delay:${a[2]}s"></i>`).join(''):'';
 return `<div class="pc ch r${k} ${lk?'lk':''}" data-n="${n}"><div class="pi"><div class="hd"><span class="cr">${ar(String(n).padStart(2,'0'))}</span><span class="ed">${ar(String(n).padStart(3,'0'))} / ${ar(32)}</span><i class="gem"></i></div><div class="art"><div class="bgi"><img alt="" src="cardimg/bg${p2}.webp"></div><img class="cut" alt="" src="cardimg/ch${p2}.webp">${lk?'<div class="lkc">🔒</div>':sp}</div><div class="bn"><h3 dir="${DIR}">${lk?(EN?'Locked card':'كارت مقفول'):c.name}</h3></div>
 ${lk?`<div class="fv" dir="${DIR}">${hint}</div>`:`<div class="ty"><span>${TRR(c.rar)}</span><span>${c.e}</span></div><div class="st"><span>📍 +100</span><span>🧩 +50</span></div><div class="fv" dir="${DIR}">${c.t}</div>`}<div class="fo"></div></div></div>`}
</script>
