const EASY={"1": {"a": ["فنار", "مرسى", "سفينة"], "e": ["Lighthouse", "Harbor", "Ship"]}, "2": {"a": ["كتاب", "مراية", "مفتاح"], "e": ["Book", "Mirror", "Key"]}, "3": {"a": ["تنيس", "دمياط", "المنزلة"], "e": ["Tinnis", "Damietta", "Manzala"]}, "4": {"a": ["حبل", "سلة", "سلم"], "e": ["Rope", "Basket", "Ladder"]}, "5": {"a": ["سمسمية", "طبلة", "مثلث"], "e": ["Simsimiyya", "Drum", "Triangle"]}, "6": {"a": ["قاعدة", "تمثال", "نافورة"], "e": ["Base", "Statue", "Fountain"]}, "7": {"a": ["بوصلة", "تلسكوب", "خريطة"], "e": ["Compass", "Telescope", "Map"]}, "8": {"a": ["ساعة", "قبعة", "قماش"], "e": ["Watch", "Hat", "Cloth"]}, "9": {"a": ["عبارة", "كوبري", "نفق"], "e": ["Ferry", "Bridge", "Tunnel"]}, "10": {"a": ["راديو", "تلفزيون", "جرامافون"], "e": ["Radio", "TV", "Gramophone"]}, "11": {"a": ["متحف", "مسرح", "مكتبة"], "e": ["Museum", "Theater", "Library"]}, "12": {"a": ["شبكة", "صنارة", "قارب"], "e": ["Net", "Fishing rod", "Boat"]}, "13": {"a": ["تذكرة", "قطار", "شنطة"], "e": ["Ticket", "Train", "Suitcase"]}, "14": {"a": ["حمامة", "عصفورة", "نورس"], "e": ["Dove", "Sparrow", "Seagull"]}, "15": {"a": ["علم", "فانوس", "خريطة"], "e": ["Flag", "Lantern", "Map"]}, "16": {"a": ["مانجو", "برتقال", "جوافة"], "e": ["Mango", "Orange", "Guava"]}, "17": {"a": ["جواب", "طرد", "مفتاح"], "e": ["Letter", "Parcel", "Key"]}, "18": {"a": ["تمثال", "لوحة", "عمود"], "e": ["Statue", "Painting", "Column"]}, "19": {"a": ["سجادة", "كرسي", "لمبة"], "e": ["Prayer rug", "Chair", "Lamp"]}, "20": {"a": ["رطوبة", "حرارة", "رياح"], "e": ["Humidity", "Heat", "Wind"]}, "21": {"a": ["جرس", "ساعة", "مدفع"], "e": ["Bell", "Clock", "Cannon"]}, "22": {"a": ["مانيكان", "فاترينة", "ميزان"], "e": ["Mannequin", "Display case", "Scale"]}, "23": {"a": ["مسلة", "منارة", "نافورة"], "e": ["Obelisk", "Lighthouse", "Fountain"]}, "24": {"a": ["لوحة", "تمثال", "خريطة"], "e": ["Painting", "Statue", "Map"]}, "25": {"a": ["رمل", "طين", "حجر"], "e": ["Sand", "Mud", "Stone"]}, "26": {"a": ["سكر", "ملح", "شاي"], "e": ["Sugar", "Salt let FAM=localStorage.getItem('hk_fam')==='1';
const AV=n=>!(FAM&&DARK.includes(+n));
RT.forEach(r=>{r.st0=r.st;Object.defineProperty(r,'st',{get(){return FAM?r.st0.filter(AV):r.st0}})});
function applyFam(){S.forEach(s=>{const m=markers[s.n];if(!m)return;if(AV(s.n)){if(!map.hasLayer(m))m.addTo(map)}else map.removeLayer(m)});count();sotdBar()}
function togFam(){FAM=!FAM;localStorage.setItem('hk_fam',FAM?'1':'0');applyFam();openMenu()}
function famChip(n){return DARK.includes(+n)?`<span class="chip" style="background:#5b2a2a">⚠ ${EN?'Mature themes (war / fear)':'مواضيع ناضجة (حرب / رعب)'}</span>`:`<span class="chip" style="background:#1d5a45">👨‍👩‍👧 ${EN?'Family-friendly':'مناسبة للعائلة'}</span>`}
function easyPick(n,i){if(i===0){okSolve(n)}else{const m=document.getElementById('mg');m.className='msg bad';m.textContent=T('wrong')}}
function okSolve(n){SOL.push(n);localStorage.setItem('hk_s',JSON.stringify(SOL));closeP('rq');cnt();showCard(n,true);if(document.getElementById('reader').classList.contains('on'))read(n)}
function easyBox(n){const o=EASY[n];if(!o)return'';const a=EN?o.e:o.a,ord=[0,1,2].map(i=>(i+n)%3),first=[...a[0]][0];
return `<div class="box"><b>${EN?'Easy mode: pick the answer':'وضع سهل: اختار الإجابة'}</b><p><small>${EN?'Easy hint: it starts with':'تلميح سهل: بتبدأ بحرف'} «${first}»</small></p>`+ord.map(i=>`<button class="o" style="width:100%;margin:5px 0" onclick="easyPick(${n},${i})">${a[i]}</button>`).join('')+'</div>'}
function dayN(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)}
function sotdN(){if(!S.length)return 0;const k=dayN();for(let i=0;i<64;i++){const n=((k+i)%32)+1;if(AV(n)&&S.find(x=>x.n==n))return n}return 1}
function sotdBar(){const e=document.getElementById('sotd'),n=sotdN(),s=S.find(x=>x.n==n);if(!s){e.style.display='none';return}e.style.display='block';e.textContent='⭐ '+(EN?'Story of the day: ':'حكاية النهارده: ')+s.t;e.onclick=()=>{map.flyTo([s.lat,s.lon],16);show(s)}}
async function nearDaily(lat,lon){if(!NATIVE)return;const s=S.find(x=>x.n==sotdN());if(!s||dist(lat,lon,s.lat,s.lon)>300)return;const k=String(dayN());if(localStorage.getItem('hk_sd')===k)return;localStorage.setItem('hk_sd',k);try{await Capacitor.Plugins.LocalNotifications.schedule({notifications:[{id:2000,title:EN?'Story of the day is near':'حكاية النهارده قريبة منك',body:s.t}]})}catch(e){}}
function mdb(){return new Promise((ok,no)=>{const q=indexedDB.open('hk_mem',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function mall(){const d=await mdb();return new Promise(ok=>{const r=d.transaction('p').objectStore('p').getAll();r.onsuccess=()=>ok(r.result||[])})}
function shrink(f){return new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);ok(b)},'image/jpeg',.82)};im.onerror=()=>ok(f);im.src=u})}
async function memAdd(n,inp){const f=inp.files&&inp.files[0];if(!f||!isU(n))return;const b=await shrink(f),d=await mdb();await new Promise(ok=>{const t=d.transaction('p','readwrite');t.objectStore('p').add({n,ts:Date.now(),b});t.oncomplete=ok});localStorage.setItem('hk_memc',(await mall()).length);memThumbs(n);inp.value=''}
async function memThumbs(n){const e=document.getElementById('mth'+n);if(!e)return;const L=(await mall()).filter(x=>x.n==n);e.className='mth';e.innerHTML=L.map(x=>`<img alt="" src="${URL.createObjectURL(x.b)}" onclick="memView(${x.id})">`).join('')}
async function openMem(){const L=(await mall()).sort((a,b)=>b.ts-a.ts),e=document.getElementById('mn');
e.innerHTML=`<h2>📷 ${EN?'Memories':'ذكرياتي'}</h2><p><small>${EN?'Photos are stored only on this phone (not uploaded). Clearing the browser data or uninstalling the app deletes them.':'الصور متخزنة على موبايلك بس (مش بتترفع). مسح بيانات المتصفح أو حذف التطبيق بيمسحها.'}</small></p>`+(L.length?`<div class="mg">${L.map(x=>`<div onclick="memView(${x.id})" style="cursor:pointer"><img alt="" src="${URL.createObjectURL(x.b)}"><small>${(S.find(s=>s.n==x.n)||{}).t||''}<br>${new Date(x.ts).toLocaleDateString(EN?'en-GB':'ar-EG')}</small></div>`).join('')}</div>`:`<div class="box"><p>${EN?'No photos yet. Open an unlocked story and tap "Add photo".':'مفيش صور لسه. افتح حكاية مفتوحة واضغط "ضيف صورة".'}</p></div>`)+`<div class="row"><button onclick="openMenu()">${EN?'Back':'رجوع'}</button></div>`;e.classList.add('on')}
async function memView(id){const x=(await mall()).find(y=>y.id==id);if(!x)return;const e=document.getElementById('cd');e.innerHTML=`<img alt="" style="width:100%;border-radius:12px" src="${URL.createObjectURL(x.b)}"><p>${(S.find(s=>s.n==x.n)||{}).t||''}</p><div class="row"><button class="o" onclick="memDel(${id})">🗑 ${EN?'Delete':'احذف'}</button><button onclick="closeP('cd')">${T('ok')}</button></div>`;e.classList.add('on')}
async function memDel(id){if(!confirm(EN?'Delete this photo from the phone?':'تمسح الصورة من الموبايل؟'))return;const d=await mdb();await new Promise(ok=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=ok});localStorage.setItem('hk_memc',(await mall()).length);closeP('cd');openMem()}
function memBox(n){return `<div class="box"><b>📷 ${EN?'My memory of this place':'ذكرى بتاعتي من المكان'}</b><p><small>${EN?'Saved only on this phone. Nothing is uploaded.':'بتتحفظ على موبايلك بس. مفيش حاجة بتترفع.'}</small></p><div class="row"><label class="btnl">${EN?'Add photo':'ضيف صورة'}<input type="file" accept="image/*" style="display:none" onchange="memAdd(${n},this)"></label></div><div id="mth${n}"></div></div>`}
let EV=JSON.parse(localStorage.getItem('hk_ev')||'[]');
function evAdd(n){EV.push({n,t:Date.now(),sd:n==sotdN()?1:0});localStorage.setItem('hk_ev',JSON.stringify(EV))}
function solarMin(t){const d=new Date(t),N=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5),g=2*Math.PI/365*(N-1),eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)),dc=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g),ph=31.26*Math.PI/180,ha=Math.acos(Math.cos(90.833*Math.PI/180)/(Math.cos(ph)*Math.cos(dc))-Math.tan(ph)*Math.tan(dc))*180/Math.PI,lon=32.3;return{rise:720-4*(lon+ha)-eq,set:720-4*(lon-ha)-eq}}
function isNight(t){const d=new Date(t),m=d.getUTCHours()*60+d.getUTCMinutes(),s=solarMin(t);return m>s.set||m<s.rise}
function exStats(){const day=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()},by={};EV.forEach(e=>{by[day(e.t)]=(by[day(e.t)]||0)+1});
return{night:EV.filter(e=>isNight(e.t)).length,tri:Math.max(0,...Object.values(by)),early:EV.filter(e=>{const h=new Date(e.t).getHours();return h>=4&&h<8}).length,days:Object.keys(by).length,sd:EV.filter(e=>e.sd).length,both:(unlocked.includes(16)||unlocked.includes(27))&&unlocked.some(n=>n!=16&&n!=27)?1:0,mem:+(localStorage.getItem('hk_memc')||0)}}
function openMenu(){const e=document.getElementById('mn');e.innerHTML=`<h2>${T('menu')}</h2>${achBox()}<div class="row"><button onclick="openRoutes()">🧭 ${EN?'Routes':'مسارات'}</button><button onclick="openMem()">📷 ${EN?'Memories':'ذكرياتي'}</button></div><div class="box"><h3>👨‍👩‍👧 ${EN?'Family mode':'وضع العائلة'}</h3><p>${EN?'Easier riddles (pick from 3 answers) and hides stories about war or scary topics.':'ألغاز أسهل (اختار من ٣ إجابات) وبيخفي الحكايات اللي عن الحرب أو الرعب.'}</p><button class="${FAM?'':'o'}" onclick="togFam()">${FAM?(EN?'Family mode: ON ✓':'وضع العائلة: شغال ✓'):(EN?'Turn on family mode':'شغّل وضع العائلة')}</button></div><div class="box"><h3>${T('offt')}</h3><div id="offb"></div></div><div class="row"><button onclick="closeP('mn')">${EN?'Back':'رجوع'}</button></div>`;e.classList.add('on');offMenu('')}

function AUD(n){if(!(n>=1&&n<=32))return '<div class="pl2 off"><div class="pb">▶</div><div style="flex:1"><div class="t">'+T('listen')+' · '+(EN?'soon':'قريبا')+'</div><div class="bar2"></div></div></div>';
return `<div class="pl2" id="pl"><div class="pb" id="pb" onclick="togA(${n})">▶</div><div style="flex:1"><div class="t" id="pt">${T('listen')}</div><div class="bar2" id="pbar" onclick="seekA(event)"><i id="pfill"></i></div>${EN?'<small style="opacity:.7">Audio is in Arabic</small>':''}</div></div>`}
function fmt(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function togA(n){if(CUR&&CUR.n!=n){CUR.a.pause();CUR=null}
if(!CUR){const a=new Audio('audio/story'+String(n).padStart(2,'0')+'.mp3');a.preload='metadata';CUR={a,n};
a.ontimeupdate=()=>{const f=document.getElementById('pfill'),t=document.getElementById('pt');if(f&&a.duration){f.style.width=(100*a.currentTime/a.duration)+'%';t.textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}};
a.onended=()=>{document.getElementById('pb').textContent='▶'};
a.onerror=()=>{const t=document.getElementById('pt');if(t)t.textContent=T('audfail')}}
const a=CUR.a,b=document.getElementById('pb');if(a.paused){a.play();b.textContent='❚❚'}else{a.pause();b.textContent='▶'}}
function seekA(e){if(!CUR||!CUR.a.duration)return;const r=e.currentTarget.getBoundingClientRect();const x=document.dir=='rtl'||getComputedStyle(e.currentTarget).direction=='rtl'?(r.right-e.clientX):(e.clientX-r.left);CUR.a.currentTime=CUR.a.duration*Math.max(0,Math.min(1,x/r.width))}
function stopA(){if(CUR){CUR.a.pause();CUR=null}}
const HERO=n=>`<img alt="" src="hero/${String(n).padStart(2,'0')}.svg" onerror="this.outerHTML=HERO0(${n})">`;
function read(n){if(!isU(+n)||!AV(n))return;n=+n;stopA();const s=S.find(x=>x.n==n),r=document.getElementById('reader');
 const body=s.secs.map(x=>{const fact=x.h.includes('[حقيقة]'),h=x.h.replace(/\[(حقيقة|خيال)\]/,'').trim();
  const ps=x.b.map(p=>`<p>${EN?p.replace(/\[حقيقة\]/g,'[Fact]').replace(/\[خيال\]/g,'[Fiction]'):p}</p>`).join('');
  return fact?`<div class="fact"><div class="fh">${T('facthdr')}${h}</div>${ps}</div>`:`<h3>${h}</h3>${ps}`}).join('');
 r.innerHTML=`<div class="hero">${HERO(n)}<a class="back" href="#" onclick="stopA();document.getElementById('reader').classList.remove('on');return false">${T('back')}</a></div><div class="panel">${EN?'<div class="hint">'+T('note')+'</div>':''}<h1 dir="${DIR}" style="text-align:${EN?'left':'right'}">${s.t}</h1>${AUD(n)}<div><span class="chip">${T('fictional')}</span><span class="chip">${s.p.split('·')[0].trim()}</span>${famChip(n)}</div><div class="tx" dir="${DIR}">${body}</div><div class="fact"><div class="fh">${T('sources')}</div>${s.src.map(x=>`<div class="src">${x}</div>`).join('')}</div>${memBox(n)}${solvedBtn(n)}</div>`;r.classList.add('on');r.scrollTop=0;memThumbs(n)}
Promise.all(['stories1.json','stories2.json'].concat(EN?['en_stories.json','en_riddles.json','en_cards.json']:[]).map(u=>fetch(u).then(r=>r.json()))).then(a=>{if(EN){const [es,er,ec]=a.slice(2);for(const s of a[0].concat(a[1])){const e=es[s.n];if(e){s.ar={t:s.t,p:s.p,tz:s.tz,secs:s.secs,src:s.src};s.t=e.t;s.p=e.p;s.tz=e.tz;s.secs=e.secs;s.src=e.src}}
 for(const k in er){const r=RD[k];if(r){r.arq=r.q;r.arh=r.hints;r.q=er[k].q;r.hints=er[k].hints;r.ansh=er[k].ansh;r.type=er[k].type}}
 for(const k in ec){const c=CARDS[k];if(c){c.arname=c.name;c.art=c.t;c.name=ec[k].name;c.t=ec[k].t}}}return a[0].concat(a[1])}).then(d=>{S=d;S.forEach(s=>{markers[s.n]=L.marker([s.lat,s.lon],{icon:icon(s)}).addTo(map).on('click',()=>show(s))});count();applyFam();
 if(q.get('demo')&&TEST){const [a,b]=q.get('demo').split(',').map(Number);setMe(a,b,true)}
 else if(NATIVE)startNative();
 else if(navigator.geolocation)navigator.geolocation.watchPosition(p=>setMe(p.coords.latitude,p.coords.longitude),e=>{},{enableHighAccuracy:true});
 if(q.get('open'))show(S.find(x=>x.n==q.get('open')));
 if(q.get('read'))read(q.get('read'))});
