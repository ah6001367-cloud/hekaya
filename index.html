<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حكاية</title><link rel="stylesheet" href="leaflet.css"><style>
html,body{margin:0;height:100%;font-family:system-ui,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;background:#0b2a52;color:#f4e9c8}
#top{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0b2a52ee;border-bottom:1px solid #e2b44c55;font-weight:700}
#top small{font-weight:400;color:#9fb4d0}
#map{position:absolute;top:50px;bottom:0;left:0;right:0}
.pin{width:30px;height:30px;border-radius:50%;background:#e2b44c;color:#0b2a52;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0b2a52;box-shadow:0 1px 6px #0008;font-size:13px}
.pin.u{background:#7fe0d4}.pin.a{border-style:dashed}
.me{width:16px;height:16px;border-radius:50%;background:#2d7ff9;border:3px solid #fff;box-shadow:0 0 0 6px #2d7ff955}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#0b2a52;border-top:2px solid #e2b44c;border-radius:18px 18px 0 0;padding:14px 16px 18px;transform:translateY(110%);transition:.25s;max-height:70%;overflow:auto}
#sheet.on{transform:none}#sheet .ph{float:left;width:38%;max-width:170px;margin:0 0 8px 12px;border-radius:10px;overflow:hidden;background:#06203f}#sheet .ph img{display:block;width:100%;height:auto}#sheet .ph small{display:block;font-size:9px;line-height:1.3;color:#9fb4d0;padding:3px 5px;direction:ltr;text-align:left}#sheet .ph small a{color:#9fb4d0}#sheet .row{clear:both}
#sheet h2{margin:0 0 4px;font-size:19px;color:#e2b44c}#sheet .pl{color:#9fb4d0;font-size:13px}
.row{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;min-height:44px;background:#e2b44c;color:#0b2a52;font-weight:700;flex:1}
button.o{background:transparent;color:#e2b44c;border:1px solid #e2b44c}button:disabled{opacity:.5}
.tz{margin-top:10px;font-size:15px;line-height:1.8;color:#f4e9c8;border-right:3px solid #e2b44c;padding-right:10px}.st{margin-top:10px;font-size:14px}.lock{color:#ffb4a8}.open{color:#7fe0d4}
#reader{position:fixed;inset:0;z-index:2000;background:#0b1a33;overflow:auto;display:none}
#reader.on{display:block}
#reader .hero{height:250px;position:relative;background:#0b2a52;overflow:hidden}
#reader .hero svg,#reader .hero img{position:absolute;inset:0;width:100%;height:100%}
#reader .back{position:absolute;top:14px;right:16px;z-index:3;background:#0b1a33aa;color:#f4e9c8;border-radius:12px;padding:6px 12px;font-size:13px;text-decoration:none}
#reader .panel{position:relative;margin-top:-16px;background:#0b1a33;border-radius:24px 24px 0 0;padding:22px 22px 40px}
#reader h1{margin:0 0 12px;font-size:24px;font-weight:800;color:#e2b44c}
.pl2{background:#12305a;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;opacity:.75}
.pl2 .pb{width:44px;height:44px;border-radius:50%;background:#e2b44c;color:#0b1a33;text-align:center;line-height:44px;font-size:18px}
.pl2 .t{font-size:12px;color:#7fe0d4}.pl2 .bar2{height:5px;background:#2b4a7a;border-radius:3px;margin:6px 0 0}
.chip{display:inline-block;background:#12305a;border:1px solid #1f6f7a;color:#7fe0d4;border-radius:20px;padding:4px 12px;font-size:12px;margin-left:6px;margin-bottom:6px}
#reader .tx{font-size:18px;line-height:2;color:#e8dfc4}
#reader h3{color:#e2b44c;font-size:16px;margin:22px 0 4px}
#reader p{margin:8px 0}
.fact{background:#12305a;border-radius:14px;padding:12px 14px;margin-top:14px;border-right:4px solid #1f6f7a}
.fact .fh{font-size:12px;color:#7fe0d4;margin-bottom:6px}
.fact p{font-size:14px;line-height:1.9;color:#cfd9e8;margin:6px 0}
.fact .src{font-size:11px;color:#6f86a8;word-break:break-all;margin-top:6px}
.cta{margin-top:22px;background:#e2b44c;color:#0b1a33;font-weight:700;border-radius:14px;padding:14px;text-align:center;font-size:16px;opacity:.55}
.leaflet-control-attribution{font-size:10px}
.pl2 .bar2{cursor:pointer}.pl2 .bar2 i{display:block;height:5px;width:0;background:#e2b44c;border-radius:3px}.pl2.off{opacity:.75}.pl2 .pb{cursor:pointer;user-select:none}#reader .hero img{object-fit:cover}@media(min-width:700px){#reader .hero{background:#0b1a33}#reader .hero img{width:auto;height:100%;aspect-ratio:390/250;left:50%;right:auto;transform:translateX(-50%);inset:0 auto 0 50%}}</style></head><body>
<div id="top"><span>حكاية · بورسعيد</span><small id="count"></small><button id="tbtn" onclick="togTest()" style="width:auto;flex:none;margin:0;white-space:nowrap;border:1px solid #e2b44c;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;background:transparent;color:#e2b44c">وضع التجربة</button></div>
<div id="map"></div>
<script src="photos.js"></script><div id="sheet"></div><div id="reader"></div>
<script src="leaflet.js"></script>
<script>
const R=150;
const qq=new URLSearchParams(location.search);if(qq.get('test')==='1')localStorage.setItem('hk_test','1');if(qq.get('test')==='0')localStorage.removeItem('hk_test');
let TEST=localStorage.getItem('hk_test')==='1';
const isU=n=>TEST||unlocked.includes(n);
function togTest(){TEST=!TEST;TEST?localStorage.setItem('hk_test','1'):localStorage.removeItem('hk_test');S.forEach(x=>markers[x.n]&&markers[x.n].setIcon(icon(x)));count();if(sel)show(sel)}
let S=[],unlocked=JSON.parse(localStorage.getItem('hk_u')||'[]'),me=null,sel=null,demo=false;
const q=new URLSearchParams(location.search);
const map=L.map('map',{zoomControl:false}).setView([31.2650,32.3050],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const dist=(a,b,c,d)=>{const r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.hypot(x,y)*6371000};
let markers={},meMk=null;
function icon(s){return L.divIcon({className:'',html:`<div class="pin ${isU(s.n)?'u':''} ${s.ok?'':'a'}">${ar(s.n)}</div>`,iconSize:[30,30]})}
function setMe(lat,lon){me={lat,lon};if(!meMk)meMk=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false,zIndexOffset:900}).addTo(map);else meMk.setLatLng([lat,lon]);
 S.forEach(s=>{if(dist(lat,lon,s.lat,s.lon)<=R&&!unlocked.includes(s.n)){unlocked.push(s.n);localStorage.setItem('hk_u',JSON.stringify(unlocked));markers[s.n].setIcon(icon(s))}});
 count();if(sel)show(sel)}
function count(){document.getElementById('count').textContent=TEST?'وضع التجربة: كله مفتوح':`${ar(unlocked.length)} من ${ar(S.length)} اتفتحوا`;const b=document.getElementById('tbtn');if(b){b.textContent=TEST?'وضع التجربة: شغال ✓':'وضع التجربة';b.style.background=TEST?'#e2b44c':'transparent';b.style.color=TEST?'#0b1a33':'#e2b44c'}}
function show(s){sel=s;const sh=document.getElementById('sheet');const u=isU(s.n);
 let st='';if(TEST&&!unlocked.includes(s.n))st='<span class="open">وضع التجربة · مفتوحة بدون لوكيشن</span>';else if(me){const d=dist(me.lat,me.lon,s.lat,s.lon);st=u?`<span class="open">اتفتحت · إنت على بعد ${ar(Math.round(d))} متر</span>`:`<span class="lock">مقفولة · لسه ${d>=1000?ar((d/1000).toFixed(1))+' كم':ar(Math.round(d))+' متر'} · لازم تبقى جوه ${ar(R)} متر</span>`}else st='<span class="lock">مقفولة · شغّل اللوكيشن أو فعّل وضع التجربة</span>';
 const ph=PH[s.n];const phh=ph?`<div class="ph"><img src="photos/${String(s.n).padStart(2,'0')}.jpg" alt="" loading="lazy"><small>${ph.x?'<b dir="rtl">صورة تقريبية · </b>':''}Photo: ${ph.a} · ${ph.l} · <a href="${ph.u}" target="_blank" rel="noopener">Wikimedia Commons</a></small></div>`:'';sh.innerHTML=`${phh}<h2>${ar(s.n)}. ${s.t}</h2><div class="pl">${s.p}</div>${s.ok?'':'<div class="pl">مكان الدبوس تقريبي</div>'}${u?'':`<div class="tz">${s.tz}</div>`}<div class="st">${st}</div><div class="row"><button ${u?'':'disabled'} onclick="read(${s.n})">${u?'اقرا الحكاية':'مقفولة'}</button><button class="o" onclick="document.getElementById('sheet').classList.remove('on');sel=null">إغلاق</button></div>`;sh.classList.add('on')}
const HERO0=n=>`<svg viewBox="0 0 390 250" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143a6b"/><stop offset="1" stop-color="#0b1a33"/></linearGradient></defs><rect width="390" height="250" fill="url(#g)"/><circle cx="300" cy="60" r="34" fill="#f4e9c8" opacity=".9"/>`+(n==1?`<polygon points="170,250 185,70 205,70 220,250" fill="#d9c9a0"/><polygon points="183,70 195,35 207,70" fill="#e2b44c"/><rect x="186" y="60" width="18" height="10" fill="#fff7c0"/><polygon points="195,62 380,200 380,120" fill="#fff7c0" opacity=".18"/>`:`<g fill="#07142a"><rect x="20" y="170" width="40" height="80"/><rect x="70" y="150" width="50" height="100"/><rect x="130" y="180" width="36" height="70"/><rect x="176" y="160" width="46" height="90"/><rect x="232" y="185" width="40" height="65"/><rect x="282" y="165" width="50" height="85"/></g>`)+`<rect y="225" width="390" height="25" fill="#07142a"/></svg>`;

let CUR=null;
function AUD(n){if(!(n>=1&&n<=32))return '<div class="pl2 off"><div class="pb">▶</div><div style="flex:1"><div class="t">الاستماع للحكاية · قريبا</div><div class="bar2"></div></div></div>';
return `<div class="pl2" id="pl"><div class="pb" id="pb" onclick="togA(${n})">▶</div><div style="flex:1"><div class="t" id="pt">الاستماع للحكاية</div><div class="bar2" id="pbar" onclick="seekA(event)"><i id="pfill"></i></div></div></div>`}
function fmt(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function togA(n){if(CUR&&CUR.n!=n){CUR.a.pause();CUR=null}
if(!CUR){const a=new Audio('audio/story'+String(n).padStart(2,'0')+'.mp3');a.preload='metadata';CUR={a,n};
a.ontimeupdate=()=>{const f=document.getElementById('pfill'),t=document.getElementById('pt');if(f&&a.duration){f.style.width=(100*a.currentTime/a.duration)+'%';t.textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}};
a.onended=()=>{document.getElementById('pb').textContent='▶'};
a.onerror=()=>{const t=document.getElementById('pt');if(t)t.textContent='تعذر تحميل الصوت'}}
const a=CUR.a,b=document.getElementById('pb');if(a.paused){a.play();b.textContent='❚❚'}else{a.pause();b.textContent='▶'}}
function seekA(e){if(!CUR||!CUR.a.duration)return;const r=e.currentTarget.getBoundingClientRect();const x=document.dir=='rtl'||getComputedStyle(e.currentTarget).direction=='rtl'?(r.right-e.clientX):(e.clientX-r.left);CUR.a.currentTime=CUR.a.duration*Math.max(0,Math.min(1,x/r.width))}
function stopA(){if(CUR){CUR.a.pause();CUR=null}}
const HERO=n=>`<img alt="" src="hero/${String(n).padStart(2,'0')}.svg" onerror="this.outerHTML=HERO0(${n})">`;
function read(n){stopA();const s=S.find(x=>x.n==n),r=document.getElementById('reader');
 const body=s.secs.map(x=>{const fact=x.h.includes('[حقيقة]'),h=x.h.replace(/\[(حقيقة|خيال)\]/,'').trim();
  const ps=x.b.map(p=>`<p>${p}</p>`).join('');
  return fact?`<div class="fact"><div class="fh">§ الحقيقة وراء الحكاية · ${h}</div>${ps}</div>`:`<h3>${h}</h3>${ps}`}).join('');
 r.innerHTML=`<div class="hero">${HERO(n)}<a class="back" href="#" onclick="stopA();document.getElementById('reader').classList.remove('on');return false">← رجوع</a></div><div class="panel"><h1>${s.t}</h1>${AUD(n)}<div><span class="chip">حكاية خيالية</span><span class="chip">${s.p.split('·')[0].trim()}</span></div><div class="tx">${body}</div><div class="fact"><div class="fh">المصادر</div>${s.src.map(x=>`<div class="src">${x}</div>`).join('')}</div><div class="cta">حل اللغز واستلم الكارت · قريبا</div></div>`;r.classList.add('on');r.scrollTop=0}
Promise.all(['stories1.json','stories2.json'].map(u=>fetch(u).then(r=>r.json()))).then(a=>a.flat()).then(d=>{S=d;S.forEach(s=>{markers[s.n]=L.marker([s.lat,s.lon],{icon:icon(s)}).addTo(map).on('click',()=>show(s))});count();
 if(q.get('demo')){const [a,b]=q.get('demo').split(',').map(Number);setMe(a,b)}
 else if(navigator.geolocation)navigator.geolocation.watchPosition(p=>setMe(p.coords.latitude,p.coords.longitude),e=>{},{enableHighAccuracy:true});
 if(q.get('open'))show(S.find(x=>x.n==q.get('open')));
 if(q.get('read'))read(q.get('read'))});
</script></body></html>
